syntax = "proto3";

package telemetry;

option java_package = "com.example.telemetry";
option java_outer_classname = "TelemetryProto";

// Osnovne informacije o uređaju
message DeviceInfo {
  string device_id = 1;
  string model = 2;
  string manufacturer = 3;
  string android_version = 4;
  int32 api_level = 5;

  // Memorijske informacije
  int64 total_memory = 6;
  int64 free_memory = 7;
  int64 used_memory = 8;

  // Mrežne informacije
  int32 wifi_signal_strength = 9;
  string wifi_ssid = 10;
  string network_operator = 11;
  string network_type = 12;

  int64 timestamp = 13;
}

// Podaci o bateriji
message BatteryData {
  float level = 1;              // Procenat napunjenosti
  bool is_charging = 2;         // Da li se puni
  int32 voltage = 3;           // Napon u mV
  float temperature = 4;        // Temperatura baterije u °C
  int64 timestamp = 5;
}

// Podaci sa senzora
message SensorData {
  float ambient_temperature = 1;    // Temperatura okoline u °C

  // Accelerometar (m/s²)
  float accelerometer_x = 2;
  float accelerometer_y = 3;
  float accelerometer_z = 4;

  // Žiroskop (rad/s)
  float gyroscope_x = 5;
  float gyroscope_y = 6;
  float gyroscope_z = 7;

  int64 timestamp = 8;
}

// NOVE KOMANDNE PORUKE! 🚀

// Osnovni tipovi komandi
enum CommandType {
  FLASHLIGHT = 0;
  CAMERA = 1;
  VIBRATE = 2;
  VOLUME = 3;
  SYSTEM = 4;
  NOTIFICATION = 5;
}

// Flashlight komande
enum FlashlightAction {
  FLASHLIGHT_ON = 0;
  FLASHLIGHT_OFF = 1;
  FLASHLIGHT_TOGGLE = 2;
}

// Camera komande
enum CameraAction {
  CAMERA_OPEN = 0;
  CAMERA_TAKE_PHOTO = 1;
}

// Vibration komande
enum VibrateAction {
  VIBRATE_SHORT = 0;
  VIBRATE_LONG = 1;
  VIBRATE_PATTERN = 2;
}

enum VolumeAction {
  VOLUME_UP = 0;
  VOLUME_DOWN = 1;
  VOLUME_MUTE = 2;
  VOLUME_SET = 3;  // Koristi se sa volume_level poljem
}

enum SystemAction {
  SYSTEM_SCREEN_ON = 0;
  SYSTEM_RESTART_APP = 1;
}

enum NotificationAction {
  NOTIFICATION_SHOW = 0;
}

message Command {
  CommandType type = 1;
  int64 timestamp = 2;
  string device_id = 3;  // Target device

  oneof command_data {
    FlashlightCommand flashlight = 10;
    CameraCommand camera = 11;
    VibrateCommand vibrate = 12;
    VolumeCommand volume = 13;
    SystemCommand system = 14;
    NotificationCommand notification = 15;
  }
}

// Specifične komandne strukture
message FlashlightCommand {
  FlashlightAction action = 1;
}

message CameraCommand {
  CameraAction action = 1;
}

message VibrateCommand {
  VibrateAction action = 1;
}

message VolumeCommand {
  VolumeAction action = 1;
  int32 volume_level = 2;  // 0-100, koristi se samo za VOLUME_SET
}

message SystemCommand {
  SystemAction action = 1;
}

message NotificationCommand {
  NotificationAction action = 1;
  string title = 2;
  string message = 3;
}

// Odgovor na komandu
message CommandResponse {
  bool success = 1;
  string message = 2;
  string original_command_type = 3;
  string device_id = 4;
  int64 timestamp = 5;
  string error_details = 6;  // Ako success = false
}

// Kombinovani telemetrijski paket (opciono)
message TelemetryPacket {
  DeviceInfo device_info = 1;
  BatteryData battery_data = 2;
  SensorData sensor_data = 3;
  int64 packet_timestamp = 4;
}